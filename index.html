<script>
  // Header no scroll
  window.addEventListener('scroll', () => {
    const header = document.getElementById('header');
    if (window.scrollY > 50) header.classList.add('scrolled');
    else header.classList.remove('scrolled');
  });

  // Animações GSAP
  document.addEventListener('DOMContentLoaded', () => {
    gsap.registerPlugin(ScrollTrigger);

    gsap.from('#heroContent', { y: 50, opacity: 0, duration: 1, delay: 0.2, ease: 'power3.out' });

    gsap.from('#descContent', { 
      scrollTrigger: { trigger: '.section-detalhes', start: 'top 80%' },
      x: -40, opacity: 0, duration: 0.8, ease: 'power2.out' 
    });
    gsap.from('#parceiroCard', { 
      scrollTrigger: { trigger: '.section-detalhes', start: 'top 80%' },
      x: 40, opacity: 0, duration: 0.8, delay: 0.2, ease: 'power2.out' 
    });

    gsap.from('.galeria-header', {
      scrollTrigger: { trigger: '.section-galeria', start: 'top 85%' },
      y: 30, opacity: 0, duration: 0.6
    });
    gsap.from('.grid-item', {
      scrollTrigger: { trigger: '.grid-galeria', start: 'top 85%' },
      y: 40, opacity: 0, duration: 0.6, stagger: 0.1, ease: 'power2.out'
    });
  });

  // Fullscreen do Vídeo
  const video = document.getElementById('obraVideo');
  const btnFullscreen = document.getElementById('btnFullscreen');

  btnFullscreen.addEventListener('click', () => {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    } else if (video.webkitRequestFullscreen) {
      video.webkitRequestFullscreen();
    } else if (video.msRequestFullscreen) {
      video.msRequestFullscreen();
    }
  });

  const handleFullscreenChange = () => {
    const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    
    if (isFullscreen === video) {
      // Entrou em tela cheia → tira o filtro escuro
      video.controls = true;
      video.muted = false;
      video.style.opacity = '1';
    } else {
      // Saiu da tela cheia → volta o filtro
      video.controls = false;
      video.muted = true;
      video.style.opacity = '0.65';
    }
  };

  document.addEventListener('fullscreenchange', handleFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
  document.addEventListener('msfullscreenchange', handleFullscreenChange);

  // Lightbox
  function openLightbox(src, desc) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxDesc').textContent = desc; 
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }

  document.getElementById('lightbox').addEventListener('click', (e) => {
    if(e.target === document.getElementById('lightbox') || e.target.classList.contains('lightbox-content')) {
      closeLightbox();
    }
  });
</script>
